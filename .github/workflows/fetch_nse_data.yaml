name: Fetch Daily NSE Volume Data

on:
  schedule:
    # Runs at 12:30 PM UTC (6:00 PM IST) every Monday through Friday after market close
    - cron: '30 12 * * 1-5'
  # Allows manual triggering from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  run-fetcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fetcher Script
        run: |
          python -c "from src.fetcher import NSEFetcher; from src.processor import VolumeProcessor; f = NSEFetcher(); p = VolumeProcessor(); p.save_snapshot(f.fetch_index_snapshot('NIFTY 50'))"

      - name: Commit and Push Updated DuckDB Database
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/volume_data.duckdb
          git commit -m "Auto-update daily NSE volume snapshot [skip ci]" || echo "No database changes to commit"
          git push